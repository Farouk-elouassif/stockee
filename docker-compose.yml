services:
  database:
    container_name: stockee_db
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5431:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - stockee_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DATABASE_USER -d $DATABASE_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  stockee_backend:
    container_name: stockee_backend
    build: .
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - stockee_network
    restart: unless-stopped
    volumes:
      - .:/app

volumes:
  db_data:

networks:
  stockee_network:
    driver: bridge